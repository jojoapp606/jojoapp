<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Admin</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div id="login" class="box"><h1>🔐 Owner Login</h1><input id="u" value="admin" placeholder="Username"><input id="pw" type="password" value="ChangeMe123!" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="panel" hidden><h1>🥤 Shop Control</h1><section class="box"><h2>Shop Settings</h2><input id="sn" placeholder="Shop name"><input id="tg" placeholder="Tagline"><input id="bg" placeholder="Pink background e.g. #ffd9e8"><input id="dc" type="number" placeholder="Delivery charge"><button onclick="save()">Save Settings</button><p>Logo:</p><input id="lf" type="file" accept="image/*"><button onclick="logoUpload()">Change Logo</button></section>
<section class="box"><h2>Add New Juice</h2><input id="pn" placeholder="Juice name"><input id="pd" placeholder="Description"><input id="pp" type="number" placeholder="Price"><input id="pc" placeholder="Category"><input id="pf" type="file" accept="image/*"><button onclick="add()">Add Juice</button></section>
<section class="box"><h2>Existing Juices</h2><div id="list"></div></section><section class="box"><h2>Orders</h2><div id="orders"></div></section></div></main>
<script>
async function get(u,o){return fetch(u,o).then(r=>r.json())}
async function login(){let r=await get("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:pw.value})});if(r.ok){login.hidden=true;panel.hidden=false;load()}else alert(r.error)}
async function load(){let d=await get("/api/shop");sn.value=d.settings.shop_name;tg.value=d.settings.tagline;bg.value=d.settings.background;dc.value=d.settings.delivery_charge;list.innerHTML=d.products.map(p=>`<div class="row"><img src="${p.image||'https://placehold.co/80x60?text=Juice'}"><b>${p.name}</b><input id="p${p.id}" type="number" value="${p.price}"><button onclick="edit(${p.id})">Save Price</button><button onclick="del(${p.id})">Delete</button></div>`).join("");let os=await get("/api/admin/orders");orders.innerHTML=os.map(o=>`<div class="order"><b>Order #${o.id}</b> — ${o.customer_name}<br>📱 ${o.phone}<br>📍 ${o.address}<br>₹${o.total} — ${o.payment_method}<br><select onchange="stat(${o.id},this.value)">${["Pending","Accepted","Preparing","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"No orders yet"}
async function save(){await get("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({shop_name:sn.value,tagline:tg.value,background:bg.value,delivery_charge:dc.value})});alert("Saved");load()}
async function logoUpload(){if(!lf.files[0])return alert("Choose logo image");let f=new FormData();f.append("image",lf.files[0]);await fetch("/api/admin/logo",{method:"POST",body:f});alert("Logo changed");load()}
async function add(){let f=new FormData();f.append("name",pn.value);f.append("description",pd.value);f.append("price",pp.value);f.append("category",pc.value||"Fresh Juice");if(pf.files[0])f.append("image",pf.files[0]);let r=await fetch("/api/admin/products",{method:"POST",body:f}),x=await r.json();if(!x.ok)alert(x.error);else{pn.value=pd.value=pp.value=pc.value="";pf.value="";load()}}
async function edit(id){let f=new FormData();f.append("price",document.getElementById("p"+id).value);await fetch("/api/admin/products/"+id,{method:"PUT",body:f});load()}
async function del(id){if(confirm("Delete juice?")){await fetch("/api/admin/products/"+id,{method:"DELETE"});load()}}
async function stat(id,status){await get("/api/admin/orders/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})})}
</script></body></html>
